name: 源码检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: client/.node-version
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev binutils
          PNPM_VERSION=$(node -p "require('./client/frontend/package.json').packageManager.split('@')[1]")
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm --dir client/frontend install --frozen-lockfile
      - name: 前端与构建工具测试
        run: |
          pnpm --dir client/frontend typecheck
          pnpm --dir client/frontend test --maxWorkers=2
          node --test client/tools/*.test.mjs
      - name: Go 测试和静态检查
        run: |
          go -C client test -tags webkit2_41 ./...
          go -C client vet -tags webkit2_41 ./...
