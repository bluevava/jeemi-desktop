# 国内常用应用与远程协助直连。参考 Jeeyio Windows 方案的应用类别。
# 专用域名/IP 规则放在本规则集之前；未列出的应用仍走 Jeemi。
# 路径按目录边界匹配，避免仅因文件名包含厂商文字就被直连。
payload:
  # Windows 厂商安装目录（含辅助进程）。
  - 'PROCESS-PATH-REGEX,(?i)[\\/]Tencent[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/](WeChat|Weixin)[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]Alibaba[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]DingTalk[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]LarkSuite[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]Feishu[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]Kingsoft[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]Baidu[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]NetEase[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/](JianYing|JianyingPro)[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]RustDesk[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]Sunlogin[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]Thunder[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]360[\\/]'
  - 'PROCESS-PATH-REGEX,(?i)[\\/]Huorong[\\/]'
  # 自定义安装目录、便携版和 Linux 原生进程使用完整名称匹配。
  - 'PROCESS-NAME-REGEX,(?i)^(WeChat|Weixin|WeChatAppEx)(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^(QQ|QQNT|TIM)(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^DingTalk(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^(Feishu|Lark)(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^(wps|wpp|et)(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^BaiduNetdisk(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^cloudmusic(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^JianyingPro(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^rustdesk(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^(SunloginClient|SunloginClient_Desktop)(\.exe)?$'
  - 'PROCESS-NAME-REGEX,(?i)^Thunder(\.exe)?$'
  # macOS 应用包包含主进程与其辅助进程。
  - 'PROCESS-PATH-REGEX,(?i)/(WeChat|微信|Weixin|QQ|DingTalk|钉钉|Feishu|飞书|Lark|WPS Office|wpsoffice|BaiduNetdisk|百度网盘|网易云音乐|NeteaseMusic|JianyingPro|剪映专业版|RustDesk|SunloginClient|向日葵远程控制|Thunder|迅雷)\.app/'
